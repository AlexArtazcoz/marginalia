name: pages

# Desplega l'app a GitHub Pages quan canvia el CODI.
# Els commits de data/books.json (guardats de l'app) NO redesplegen:
# l'app llegeix les dades fresques directament del repo (raw/API).
on:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'storage.js', 'styles.css', 'essentials/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
